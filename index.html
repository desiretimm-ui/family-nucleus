<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>FamilyOS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- LOGIN SCREEN -->
        <div id="login-screen" class="centered-screen">
            <div class="login-card">
                <div class="login-header">
                    <h1>🏡 FamilyOS</h1>
                    <p>Welcome home. Enter your family's invite code.</p>
                </div>
                <div class="login-form">
                    <input type="text" id="inviteCodeInput" placeholder="Invite Code (e.g. TEST123)" value="TEST123">
                    <input type="text" id="displayNameInput" placeholder="Your name">
                    <button id="loginBtn">Enter the Hub</button>
                    <p id="loginError" class="error-text"></p>
                </div>
            </div>
        </div>

        <!-- MAIN APP -->
        <div id="main-app" style="display: none;">
            <header>
                <div class="header-left">
                    <h2>🏡 FamilyOS</h2>
                    <span id="welcomeUser" class="welcome-text"></span>
                </div>
                <button id="logoutBtn" class="btn-outline">Logout</button>
            </header>

            <main>
                <!-- EVENT SELECTOR -->
                <section class="card">
                    <h3>📂 Switch Event</h3>
                    <select id="eventSelector" class="full-width-input">
                        <option value="">-- Load an existing event --</option>
                    </select>
                </section>

                <!-- CREATE EVENT WIZARD -->
                <section class="card">
                    <h3>🆕 Plan New Event</h3>
                    <select id="eventType" class="full-width-input">
                        <option value="">-- Choose an event type --</option>
                        <option value="birthday">🎂 Birthday</option>
                        <option value="anniversary">💕 Anniversary</option>
                        <option value="dinner">🍽️ Dinner / Braai</option>
                        <option value="other">📝 Custom Event</option>
                    </select>
                    
                    <div id="step-2" style="display: none; margin-top: 15px;">
                        <div id="question-area" class="question-grid"></div>
                        <button id="createEventBtn" class="btn-primary" style="margin-top: 15px;">✅ Create Event</button>
                    </div>
                </section>

                <!-- CHECKLIST DASHBOARD -->
                <div id="results" style="display: none;">
                    <section class="card">
                        <div class="flex-header">
                            <h3>📋 Checklist <span id="currentEventTitle" class="subtitle"></span></h3>
                        </div>
                        <div id="checklist" class="task-list"></div>
                        <div class="task-input-group">
                            <input type="text" id="newTaskInput" placeholder="Add a new task...">
                            <button id="addTaskBtn" class="btn-icon">+</button>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
